name: Upload to PyPI

on:
  # Trigger on version tag push
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    name: Build distribution package
    runs-on: ubuntu-slim
    permissions: # Mandatory for trusted publishing
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ensure CHANGELOG and pyproject.toml versions match the tag
      - name: Check tag and version coherency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make check-version RELEASE_TAG="$RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install twine and build
        run: |
          python -m pip install twine build

      - name: Generate source-distribution and wheel
        run: python -m build

      - name: Publish package to PyPI
        run: |
          python -m twine upload --repository pypi dist/* --verbose
