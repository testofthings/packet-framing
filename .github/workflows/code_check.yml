name: Automatic code checks

on:
  push:
    paths:
      - framing/**
      - tests/**
    branches-ignore:
      - '*no-test*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Required to access the full commit history for the loop

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Lint and Type-Check each commit
      run: |
        set -e # Explicitly tells bash to instantly exit if any command fails

        # 1. Determine the exact commit range
        if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
          # New branch: compare against the default branch to get ALL new commits
          COMMIT_RANGE="origin/${{ github.event.repository.default_branch }}..HEAD"
        else
          COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
        fi

        # Safety check: If the 'before' commit is missing (e.g., force push), compare to default branch
        if ! git cat-file -e ${{ github.event.before }}^{commit} 2>/dev/null && [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
          echo "Force push detected or base commit missing. Comparing to default branch."
          COMMIT_RANGE="origin/${{ github.event.repository.default_branch }}..HEAD"
        fi

        # 2. Extract hashes strictly from OLDEST to NEWEST
        COMMITS=$(git log --no-merges --reverse --format=%H $COMMIT_RANGE)

        # Final fallback just in case the push contains zero valid commits (e.g. empty merge)
        if [ -z "$COMMITS" ]; then
          COMMITS=${{ github.sha }}
        fi

        # 3. Loop through and run checks
        for COMMIT in $COMMITS; do
          echo "=================================================="
          echo "Validating commit: $COMMIT"
          echo "=================================================="
          git checkout $COMMIT
          
          echo "Running pylint..."
          pylint framing
          
          echo "Running mypy..."
          mypy framing
        done

    - name: Run unit tests on final push state
      run: |
        # Checkout the final HEAD commit of the branch before testing
        git checkout ${{ github.sha }}
        
        echo "Running pytest..."
        pytest tests