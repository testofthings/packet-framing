name: Automatic code checks

on:
  push:
    paths:
      - framing/**
      - tests/**
    branches-ignore:
      - '*no-test*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Required to access the full commit history for the loop

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        
    - name: Run unit tests on final push state
      run: |
        # Checkout the final HEAD commit of the branch before testing
        git checkout ${{ github.sha }}
        
        echo "Running pytest..."
        pytest tests

    - name: Lint and Type-Check each commit
      run: |
        # set -e # Explicitly tells bash to instantly exit if any command fails

        # 1. Extract exactly which commits were pushed (Oldest to Newest)
        if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e ${{ github.event.before }}^{commit} 2>/dev/null; then
          # Standard push: Git perfectly isolates the newly pushed commits
          COMMITS=$(git log --no-merges --reverse --format=%H ${{ github.event.before }}..${{ github.sha }})
        else
          # New branch or force-push: We read the exact commits directly from the GitHub push payload.
          # Filtering by 'distinct == true' prevents it from grabbing commits belonging to parent branches.
          COMMITS=$(jq -r '.commits[] | select(.distinct == true) | .id' "$GITHUB_EVENT_PATH")
        fi

        # Final fallback just in case the push contains zero valid distinct commits
        if [ -z "$COMMITS" ]; then
          COMMITS=${{ github.sha }}
        fi

        # 2. Loop through and run checks
        for COMMIT in $COMMITS; do
          echo "=================================================="
          echo "Validating commit: $COMMIT"
          echo "=================================================="
          git checkout $COMMIT
          
          echo "Running pylint..."
          pylint framing
          
          echo "Running mypy..."
          mypy framing
        done

