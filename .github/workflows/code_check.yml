name: Automatic code checks

on:
  push:
    paths:
      - framing/**
      - tests/**
    branches-ignore:
      - '*no-test*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Required to access the full commit history for the loop

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Lint and Type-Check each commit
      run: |
        set -e # Explicitly tells bash to instantly exit if any command fails

        # 1. Determine the commit range for this push
        if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
          COMMIT_RANGE="HEAD~1..HEAD"
        else
          COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
        fi

        # 2. Extract the list of commit hashes
        COMMITS=$(git rev-list --no-merges --reverse $COMMIT_RANGE)
        if [ -z "$COMMITS" ]; then
          COMMITS=${{ github.sha }}
        fi

        # 3. Loop through for mypy and pylint ONLY
        for COMMIT in $COMMITS; do
          echo "=================================================="
          echo "Validating commit: $COMMIT"
          echo "=================================================="
          git checkout $COMMIT
          
          echo "Running pylint..."
          pylint framing
          
          echo "Running mypy..."
          mypy framing
        done

    - name: Run unit tests on final push state
      run: |
        # Checkout the final HEAD commit of the branch before testing
        git checkout ${{ github.sha }}
        
        echo "Running pytest..."
        pytest tests